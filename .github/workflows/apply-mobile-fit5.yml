name: Apply mobile-safe widest-line fit

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'Run mobile fit5 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile-safe production patch
        run: python scripts/patch_fit_v3.py
      - name: Commit production payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/index.html.gz.b64
          git rm .github/workflows/apply-mobile-fit5.yml
          git commit -m "Fix mobile font scaling and Safari font readiness"
          git push
