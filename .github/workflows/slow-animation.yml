name: Apply half-speed clock animation

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == 'Run half-speed animation patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Slow animation and preserve panel staggering
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = Path('build/index.html.gz.b64')
          index = Path('index.html')

          old_out = "await sleep(10,token,p)"
          new_out = "await sleep(20,token,p)"
          old_in = "await sleep(p.name==='centre'?19:16,token,p)"
          new_in = "await sleep(p.name==='centre'?38:32,token,p)"
          old_offsets = "LEFT_OFFSET=5000,RIGHT_OFFSET=20000"
          new_offsets = "LEFT_OFFSET=7000,RIGHT_OFFSET=22000"

          def patch(text: str, label: str) -> str:
              if old_out in text:
                  if text.count(old_out) != 1:
                      raise SystemExit(f'{label}: expected one delete timing marker, found {text.count(old_out)}')
                  text = text.replace(old_out, new_out, 1)
              elif new_out not in text:
                  raise SystemExit(f'{label}: delete timing marker missing')

              if old_in in text:
                  if text.count(old_in) != 1:
                      raise SystemExit(f'{label}: expected one type timing marker, found {text.count(old_in)}')
                  text = text.replace(old_in, new_in, 1)
              elif new_in not in text:
                  raise SystemExit(f'{label}: type timing marker missing')

              if old_offsets in text:
                  if text.count(old_offsets) != 1:
                      raise SystemExit(f'{label}: expected one offset marker, found {text.count(old_offsets)}')
                  text = text.replace(old_offsets, new_offsets, 1)
              elif new_offsets not in text:
                  raise SystemExit(f'{label}: offset marker missing')

              return text

          html = patch(index.read_text(encoding='utf-8'), 'index.html')
          packed_html = gzip.decompress(base64.b64decode(payload.read_text().strip())).decode('utf-8')
          packed_html = patch(packed_html, 'build payload')

          if html != packed_html:
              raise SystemExit('index.html and build payload diverged after timing patch')

          index.write_text(html, encoding='utf-8')
          payload.write_text(
              base64.b64encode(gzip.compress(html.encode('utf-8'), compresslevel=9, mtime=0)).decode('ascii') + '\n',
              encoding='utf-8',
          )

          assert new_out in html
          assert new_in in html
          assert new_offsets in html
          print('Delete timing: 10ms -> 20ms per character')
          print('Side typing: 16ms -> 32ms per character')
          print('Centre typing: 19ms -> 38ms per character')
          print('Left transition offset: 7 seconds')
          print('Right transition offset: 22 seconds')
          PY

      - name: Commit animation timing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/index.html.gz.b64
          if git diff --cached --quiet; then
            echo "Animation timing already current."
          else
            git commit -m "Slow clock animation and preserve staggering"
            git push
          fi

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --reason completed
