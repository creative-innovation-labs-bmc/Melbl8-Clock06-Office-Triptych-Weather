name: Materialise production site

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Deploy tested site]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore tested index
        run: |
          base64 --decode build/index.html.gz.b64 | gzip --decompress > index.html

      - name: Vendor PT Serif and Open Sans
        run: |
          mkdir -p assets/fonts
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock05-Office-Triptych/main/assets/fonts/PT_Serif-Web-Bold.ttf \
            --output assets/fonts/PT_Serif-Web-Bold.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock05-Office-Triptych/main/assets/fonts/OpenSans-Variable.ttf \
            --output assets/fonts/OpenSans-Variable.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OFL.txt \
            --output assets/fonts/OFL.txt

      - name: Commit production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/fonts
          if git diff --cached --quiet; then
            echo "Production files already current."
          else
            git commit -m "Build weather triptych and vendor fonts"
            git push
          fi

      - name: Close deployment request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Tested production site materialised and fonts vendored."
