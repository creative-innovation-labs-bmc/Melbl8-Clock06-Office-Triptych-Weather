name: Apply final crop and fallback QC patch

on:
  push:
    paths:
      - '.github/workflows/patch-qc4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production source and payload
        run: python scripts/patch_qc4.py
      - name: Commit final QC patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/index.html.gz.b64
          git rm .github/workflows/patch-qc4.yml
          git commit -m "Bump spacing cache and localise fallback context lines"
          git push
