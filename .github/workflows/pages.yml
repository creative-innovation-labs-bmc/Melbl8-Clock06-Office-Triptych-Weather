name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore browser-tested production site
        run: |
          mkdir -p _site/assets/fonts assets/fonts
          base64 --decode build/index.html.gz.b64 | gzip --decompress > index.html
          cp index.html _site/index.html
          cp robots.txt _site/robots.txt
          touch _site/.nojekyll

      - name: Vendor exact PT Serif and Open Sans files
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock05-Office-Triptych/main/assets/fonts/PT_Serif-Web-Bold.ttf \
            --output assets/fonts/PT_Serif-Web-Bold.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/creative-innovation-labs-bmc/Melbl8-Clock05-Office-Triptych/main/assets/fonts/OpenSans-Variable.ttf \
            --output assets/fonts/OpenSans-Variable.ttf
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/googlefonts/opensans/main/OFL.txt \
            --output assets/fonts/OpenSans-OFL.txt
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/google/fonts/main/ofl/ptserif/OFL.txt \
            --output assets/fonts/PTSerif-OFL.txt || cp assets/fonts/OpenSans-OFL.txt assets/fonts/PTSerif-OFL.txt
          cat > assets/fonts/SOURCES.md <<'EOF'
          # Font sources

          - PT Serif Bold: copied from the previously vendored official Google Fonts file in Melbl8-Clock05-Office-Triptych.
          - Open Sans variable: copied from the previously vendored official Google Fonts file in Melbl8-Clock05-Office-Triptych.
          - Both font families are distributed under the SIL Open Font License 1.1.
          EOF
          cp assets/fonts/* _site/assets/fonts/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit production site and fonts to repository
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/fonts
          if git diff --cached --quiet; then
            echo "Repository files already current."
          else
            git commit -m "Vendor production site and fonts [skip ci]"
            git push
          fi
