name: Apply language and timing QC patch

on:
  push:
    paths:
      - '.github/workflows/patch-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch production source and payload
        run: python scripts/patch_clock06.py

      - name: Commit patched production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/index.html.gz.b64
          git rm .github/workflows/patch-v3.yml
          git commit -m "Localise context lines and stagger all clock transitions"
          git push
