name: Apply widest-line fit patch

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == 'Run widest-line fit patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production source and payload
        run: python scripts/patch_fit_v3.py
      - name: Commit tested production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/index.html.gz.b64
          git rm .github/workflows/patch-fit-v3.yml scripts/patch_fit_v3.py
          git commit -m "Scale all lines from the widest rendered line"
          git push
